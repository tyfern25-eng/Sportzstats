name: Update stats and projections

on:
  schedule:
    # times are UTC: Tue 9am, Wed 6pm, Fri 6pm, Sat 6pm, Sun 3pm Central
    - cron: "17 15 * * 2"
    - cron: "17 0 * * 4"
    - cron: "17 0 * * 6"
    - cron: "17 0 * * 0"
    - cron: "17 21 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Build data (backtest on Tuesdays)
        run: |
          if [ "$(date -u +%u)" = "2" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python pipeline/build_data.py --backtest
          else
            python pipeline/build_data.py
          fi
      - name: Commit updated data
        run: |
          git config user.name "sportzstats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
